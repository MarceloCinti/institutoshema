<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" role="img" aria-labelledby="t">
  <title id="t">Instituto Shema — Paraguay</title>
  <defs>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f3dc97"/>
      <stop offset=".35" stop-color="#d4ab52"/>
      <stop offset=".65" stop-color="#a07425"/>
      <stop offset="1" stop-color="#e9c977"/>
    </linearGradient>
    <linearGradient id="goldV" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8a6420"/>
      <stop offset=".45" stop-color="#e8c56f"/>
      <stop offset="1" stop-color="#8a6420"/>
    </linearGradient>
    <radialGradient id="navy" cx=".5" cy=".45" r=".6">
      <stop offset="0" stop-color="#26388a"/>
      <stop offset="1" stop-color="#121b4f"/>
    </radialGradient>
    <radialGradient id="cream" cx=".5" cy=".4" r=".65">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#f1e9d6"/>
    </radialGradient>
    <linearGradient id="flame" x1="0" y1="1" x2="0" y2="0">
      <stop offset="0" stop-color="#e2540f"/>
      <stop offset=".5" stop-color="#f7a21b"/>
      <stop offset="1" stop-color="#ffe27a"/>
    </linearGradient>
    <linearGradient id="horn" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a1a12"/>
      <stop offset=".5" stop-color="#7b2d1d"/>
      <stop offset="1" stop-color="#3d150e"/>
    </linearGradient>
    <path id="arcTop" d="M 50,200 A 150,150 0 0 1 350,200"/>
    <path id="arcBottom" d="M 25,200 A 175,175 0 0 0 375,200"/>
    <g id="flameShape">
      <path d="M0,-16 C6,-9 7,-3 5,2 C3,6 -3,6 -5,2 C-7,-3 -5,-9 0,-16 Z" fill="url(#flame)"/>
      <path d="M0,-8 C2.5,-4 3,-1 2,1.5 C1,3 -1,3 -2,1.5 C-3,-1 -2,-4 0,-8 Z" fill="#fff4c2"/>
    </g>
    <g id="sprig" fill="url(#gold)">
      <path d="M0,0 L0,-34" stroke="url(#gold)" stroke-width="1.6" fill="none"/>
      <ellipse cx="-4" cy="-8" rx="2.4" ry="5.5" transform="rotate(-30 -4 -8)"/>
      <ellipse cx="4" cy="-8" rx="2.4" ry="5.5" transform="rotate(30 4 -8)"/>
      <ellipse cx="-4" cy="-17" rx="2.4" ry="5.5" transform="rotate(-30 -4 -17)"/>
      <ellipse cx="4" cy="-17" rx="2.4" ry="5.5" transform="rotate(30 4 -17)"/>
      <ellipse cx="-3.5" cy="-26" rx="2.2" ry="5" transform="rotate(-25 -3.5 -26)"/>
      <ellipse cx="3.5" cy="-26" rx="2.2" ry="5" transform="rotate(25 3.5 -26)"/>
      <ellipse cx="0" cy="-35" rx="2.2" ry="5"/>
    </g>
  </defs>

  <!-- Anillos -->
  <circle cx="200" cy="200" r="197" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="189" fill="url(#navy)"/>
  <circle cx="200" cy="200" r="184" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity=".7"/>
  <circle cx="200" cy="200" r="139" fill="url(#gold)"/>
  <circle cx="200" cy="200" r="132" fill="url(#cream)"/>
  <circle cx="200" cy="200" r="126" fill="none" stroke="#d4ab52" stroke-width=".8" opacity=".6"/>

  <!-- Texto circular -->
  <text font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" font-size="31" letter-spacing="3" fill="url(#gold)" stroke="#5b4216" stroke-width=".4">
    <textPath href="#arcTop" startOffset="50%" text-anchor="middle">INSTITUTO SHEMA</textPath>
  </text>
  <text font-family="Cinzel, 'Trajan Pro', Georgia, 'Times New Roman', serif" font-weight="700" font-size="25" letter-spacing="5" fill="url(#gold)" stroke="#5b4216" stroke-width=".4">
    <textPath href="#arcBottom" startOffset="50%" text-anchor="middle">PARAGUAY</textPath>
  </text>

  <!-- Ramitas laterales -->
  <use href="#sprig" transform="translate(52 268) rotate(-28)"/>
  <use href="#sprig" transform="translate(348 268) rotate(28)"/>
  <circle cx="34" cy="200" r="3.2" fill="url(#gold)"/>
  <circle cx="366" cy="200" r="3.2" fill="url(#gold)"/>

  <!-- Menorá -->
  <g fill="none" stroke="url(#goldV)" stroke-width="7" stroke-linecap="round">
    <path d="M134,118 V146 A66,66 0 0 0 266,146 V118"/>
    <path d="M156,118 V146 A44,44 0 0 0 244,146 V118"/>
    <path d="M178,118 V146 A22,22 0 0 0 222,146 V118"/>
  </g>
  <rect x="196.5" y="112" width="7" height="174" rx="3" fill="url(#goldV)"/>
  <g fill="url(#gold)" stroke="#7c5a1d" stroke-width=".6">
    <path d="M128,108 h12 l-2,10 h-8 z"/>
    <path d="M150,108 h12 l-2,10 h-8 z"/>
    <path d="M172,108 h12 l-2,10 h-8 z"/>
    <path d="M193,102 h14 l-2,12 h-10 z"/>
    <path d="M216,108 h12 l-2,10 h-8 z"/>
    <path d="M238,108 h12 l-2,10 h-8 z"/>
    <path d="M260,108 h12 l-2,10 h-8 z"/>
    <path d="M184,284 h32 l8,10 h-48 z"/>
    <rect x="168" y="294" width="64" height="6" rx="2"/>
  </g>
  <!-- Gemas -->
  <g stroke="#7c5a1d" stroke-width=".5">
    <rect x="197" y="165" width="6" height="6" transform="rotate(45 200 168)" fill="#b3122a"/>
    <rect x="197" y="186" width="6" height="6" transform="rotate(45 200 189)" fill="#1f3fae"/>
    <rect x="197" y="207" width="6" height="6" transform="rotate(45 200 210)" fill="#b3122a"/>
    <rect x="152" y="138" width="5" height="5" transform="rotate(45 154.5 140.5)" fill="#1f3fae"/>
    <rect x="243" y="138" width="5" height="5" transform="rotate(45 245.5 140.5)" fill="#1f3fae"/>
    <rect x="131" y="138" width="5" height="5" transform="rotate(45 133.5 140.5)" fill="#b3122a"/>
    <rect x="264" y="138" width="5" height="5" transform="rotate(45 266.5 140.5)" fill="#b3122a"/>
  </g>
  <!-- Llamas -->
  <use href="#flameShape" transform="translate(134 104)"/>
  <use href="#flameShape" transform="translate(156 104)"/>
  <use href="#flameShape" transform="translate(178 104)"/>
  <use href="#flameShape" transform="translate(200 98) scale(1.2)"/>
  <use href="#flameShape" transform="translate(222 104)"/>
  <use href="#flameShape" transform="translate(244 104)"/>
  <use href="#flameShape" transform="translate(266 104)"/>

  <!-- Shofar -->
  <path d="M92,206 C132,214 160,250 205,246 C240,243 262,232 300,240 C306,241 312,243 316,246 L314,252 C306,250 298,248 290,248 C262,248 246,262 207,264 C158,267 130,240 90,232 Z"
        fill="url(#horn)" stroke="#2a0d08" stroke-width=".8"/>
  <ellipse cx="91" cy="219" rx="6" ry="13.5" fill="url(#gold)" stroke="#7c5a1d" stroke-width=".8"/>
  <ellipse cx="91" cy="219" rx="3.2" ry="9.5" fill="#5c3a12"/>
  <g fill="none" stroke="url(#gold)" stroke-width="2.4">
    <path d="M124,214 C128,222 130,232 128,242"/>
    <path d="M168,237 C172,244 173,252 171,261"/>
    <path d="M232,240 C236,246 236,252 233,259"/>
    <path d="M283,240 C286,243 286,246 284,249"/>
  </g>
  <path d="M308,243 L316,246 L314,252 L306,250 Z" fill="url(#gold)"/>

  <!-- Cita -->
  <text x="200" y="326" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-style="italic" font-size="14" fill="#7c5a1d">Deuteronomio 6:4</text>
</svg>
